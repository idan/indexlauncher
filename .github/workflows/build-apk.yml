name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # Required to create draft releases and attach the APK.

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index-launcher-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-${GITHUB_SHA: -6}"
          apk="app/build/outputs/apk/debug/app-debug.apk"

          if release=$(gh release view "$tag" --json isDraft,targetCommitish 2>/dev/null); then
            if ! jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha' <<< "$release" >/dev/null; then
              echo "::error::Release $tag already exists and is not a draft for this commit."
              exit 1
            fi
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --draft \
              --title "$tag" \
              --target "$GITHUB_SHA" \
              --notes "Development debug APK built from commit ${GITHUB_SHA}."
          fi
